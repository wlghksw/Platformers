name: Daily Market Briefing (KST 08:00)

on:
  # 매일 KST 08:00 = UTC 23:00 (전날)
  schedule:
    - cron: "0 23 * * *"

  # 수동 실행 (테스트용)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (업로드 없이 미리보기만)"
        type: boolean
        default: false

jobs:
  briefing:
    name: Generate & Upload Briefing
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Python 환경 설정
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Node.js 환경 설정 (Puppeteer용)
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      # Puppeteer에 필요한 Chrome 의존성
      - name: Install Chromium dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgconf-2-4 libatk1.0-0 libatk-bridge2.0-0 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 \
            libxkbcommon0 libpango-1.0-0 libcairo2 libasound2

      # 실제 파이프라인 실행
      - name: Run briefing pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python main.py $DRY_FLAG

      # 생성된 PDF를 아티팩트로 보관 (30일)
      - name: Upload PDF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-${{ github.run_number }}
          path: output/pdf/*.pdf
          retention-days: 30

      # 실패 시 Slack 알림 (선택사항 — SLACK_WEBHOOK 시크릿 설정 시 활성화)
      - name: Notify failure
        if: failure() && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{"text":"❌ 주식 브리핑 파이프라인 실패 — GitHub Actions 로그 확인 필요"}'
