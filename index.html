<!-- =================== DATA + SCRIPT =================== -->
<script src="assets/js/connector_data.js"></script>
<script src="assets/js/connector_details.js"></script>
<script src="assets/js/ai_prompt_data.js"></script>
<script>
// ============================================================
//  STATE
// ============================================================
const state = {
  query: '',
  scenario: null,    // 활성 시나리오 버튼 keywords
  tier: 'all',       // 'all' | 'Standard' | 'Premium'
  categories: new Set(),  // 선택된 카테고리들 (비어있으면 전체)
  sort: 'relevance',
  viewMode: 'grid',  // 'grid' | 'list'
  results: [],
  openConnector: null,
};

// ============================================================
//  FUSE.JS SETUP
// ============================================================
const fuseOptions = {
  keys: [
    { name: 'nameKo',      weight: 0.25 },
    { name: 'nameEn',      weight: 0.15 },
    { name: 'triggers',    weight: 0.25 },
    { name: 'actions',     weight: 0.25 },
    { name: 'description', weight: 0.10 },
    { name: 'category',    weight: 0.05 },
    { name: 'searchTags',  weight: 0.30 },
  ],
  threshold: 0.4,
  includeScore: true,
  ignoreLocation: true,
  minMatchCharLength: 1,
};

const fuse = new Fuse(CONNECTORS, fuseOptions);

// AI 프롬프트 검색용 Fuse
const promptFuse = new Fuse(PROMPTS, {
  keys: ['title', 'category', 'tags', 'prompt'],
  threshold: 0.3
});

// ============================================================
//  CATEGORIES INIT
// ============================================================
function initCategories() {
  const catCount = {};
  CONNECTORS.forEach(c => {
    catCount[c.category] = (catCount[c.category] || 0) + 1;
  });
  const cats = Object.keys(catCount).sort();
  const list = document.getElementById('category-list');
  list.innerHTML = '';
  cats.forEach(cat => {
    const item = document.createElement('label');
    item.className = 'cat-item';
    item.innerHTML = `
      <input type="checkbox" value="${cat}" class="cat-cb">
      <span class="cat-name">${cat}</span>
      <span class="cat-count">${catCount[cat]}</span>
    `;
    item.querySelector('.cat-cb').addEventListener('change', e => {
      if (e.target.checked) state.categories.add(cat);
      else state.categories.delete(cat);
      // UI 업데이트
      item.classList.toggle('selected', e.target.checked);
      search();
    });
    list.appendChild(item);
  });
}

// ============================================================
//  SEARCH ENGINE
// ============================================================
function search() {
  let pool = [];

  // 1) 키워드 검색 (Fuse.js) OR 전체
  if (state.query.trim().length > 0) {
    pool = fuse.search(state.query).map(r => ({ ...r.item, _score: r.score }));
  } else if (state.scenario) {
    // 시나리오 키워드로 Fuse 검색 (OR 검색: 가장 높은 점수 사용)
    const kwds = state.scenario.split(',').map(k => k.trim()).filter(Boolean);
    const scoreMap = {};
    kwds.forEach(kw => {
      const res = fuse.search(kw);
      res.forEach(r => {
        if (!scoreMap[r.item.id] || r.score < scoreMap[r.item.id].score) {
          scoreMap[r.item.id] = { ...r.item, _score: r.score };
        }
      });
    });
    pool = Object.values(scoreMap).sort((a, b) => a._score - b._score);
  } else {
    pool = CONNECTORS.map(c => ({ ...c, _score: 0 }));
  }

  // 2) Tier 필터
  if (state.tier !== 'all') {
    pool = pool.filter(c => c.tier === state.tier);
  }

  // 3) Category 필터
  if (state.categories.size > 0) {
    pool = pool.filter(c => state.categories.has(c.category));
  }

  // 4) 정렬
  if (state.sort === 'nameKo') {
    pool.sort((a, b) => a.nameKo.localeCompare(b.nameKo, 'ko'));
  } else if (state.sort === 'category') {
    pool.sort((a, b) => a.category.localeCompare(b.category, 'ko') || a.nameKo.localeCompare(b.nameKo, 'ko'));
  } else if (state.sort === 'tier-std') {
    pool.sort((a, b) => {
      if (a.tier === b.tier) return a.nameKo.localeCompare(b.nameKo, 'ko');
      return a.tier === 'Standard' ? -1 : 1;
    });
  }
  // else relevance: 기본 Fuse 순서 유지

  state.results = pool;
  render();
}

// ============================================================
//  HIGHLIGHT HELPER
// ============================================================
function highlight(text, query) {
  if (!query || query.length < 2) return escapeHtml(text);
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`(${escaped})`, 'gi');
  return escapeHtml(text).replace(re, '<mark>$1</mark>');
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============================================================
//  RENDER CARDS
// ============================================================
function render() {
  const container = document.getElementById('cards-container');
  const q = state.query;

  // 결과 카운트 업데이트
  document.getElementById('result-count').textContent = state.results.length.toLocaleString();
  document.getElementById('stat-results').textContent = state.results.length.toLocaleString();

  // 검색어 라벨
  const label = document.getElementById('search-query-label');
  if (q) label.textContent = `— "${q}" 검색 결과`;
  else if (state.scenario) label.textContent = '— 시나리오 검색';
  else label.textContent = '';

  // 빈 결과
  if (state.results.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <div class="empty-title">검색 결과가 없습니다</div>
        <div class="empty-desc">다른 키워드를 시도하거나 필터를 초기화해 보세요.</div>
        <button class="empty-reset" onclick="resetAll()">전체 초기화</button>
      </div>
    `;
    return;
  }

  container.innerHTML = '';

  state.results.forEach((c, idx) => {
    const card = document.createElement('div');
    card.className = 'connector-card';
    card.style.animationDelay = `${Math.min(idx, 20) * 20}ms`;
    card.setAttribute('data-id', c.id);

    const tierBadge = c.tier === 'Standard'
      ? '<span class="badge badge-standard">Standard</span>'
      : '<span class="badge badge-premium">Premium</span>';

    const tierIcon = c.tier === 'Standard' ? '🟢' : '🟡';

    // 트리거 태그 (최대 3개)
    const triggerTags = c.triggers.length > 0
      ? c.triggers.slice(0, 3).map(t =>
          `<span class="tag tag-trigger">${highlight(t, q)}</span>`
        ).join('') + (c.triggers.length > 3 ? `<span class="tag tag-more">+${c.triggers.length - 3}</span>` : '')
      : '<span style="font-size:12px;color:var(--color-text-l)">없음</span>';

    // 액션 태그 (최대 3개)
    const actionTags = c.actions.length > 0
      ? c.actions.slice(0, 3).map(a =>
          `<span class="tag tag-action">${highlight(a, q)}</span>`
        ).join('') + (c.actions.length > 3 ? `<span class="tag tag-more">+${c.actions.length - 3}</span>` : '')
      : '<span style="font-size:12px;color:var(--color-text-l)">없음</span>';

    card.innerHTML = `
      <div class="card-header">
        <div class="card-badges">
          <span class="badge badge-category">${escapeHtml(c.category)}</span>
          ${tierBadge}
        </div>
        <div class="card-tier-icon">${tierIcon}</div>
      </div>
      <div class="card-name">
        <div class="card-name-ko">${highlight(c.nameKo, q)}</div>
        <div class="card-name-en">${highlight(c.nameEn, q)}</div>
      </div>
      <div class="card-desc">${highlight(c.description, q)}</div>
      <div class="card-items">
        <div class="card-item-row">
          <span class="card-item-label">⚡ 트리거</span>
          <div class="card-tags">${triggerTags}</div>
        </div>
        <div class="card-item-row">
          <span class="card-item-label">🎯 액션</span>
          <div class="card-tags">${actionTags}</div>
        </div>
      </div>
    `;

    card.addEventListener('click', () => openModal(c.id));
    container.appendChild(card);
  });
}

// ============================================================
//  MODAL
// ============================================================
function openModal(id) {
  const c = CONNECTORS.find(x => x.id === id);
  if (!c) return;
  state.openConnector = id;

  // 뱃지
  const tierBadge = c.tier === 'Standard'
    ? '<span class="badge badge-standard">Standard</span>'
    : '<span class="badge badge-premium">Premium</span>';
  document.getElementById('modal-badges').innerHTML =
    `<span class="badge badge-category">${escapeHtml(c.category)}</span>${tierBadge}`;

  document.getElementById('modal-title').textContent = c.nameKo;
  document.getElementById('modal-name-en').textContent = c.nameEn;
  document.getElementById('modal-desc').textContent = c.description;

  // Triggers
  const trigSec = document.getElementById('modal-triggers-section');
  const trigWrap = document.getElementById('modal-triggers');
  if (c.triggers.length > 0) {
    trigWrap.innerHTML = c.triggers.map(t =>
      `<span class="modal-tag modal-tag-trigger">${escapeHtml(t)}</span>`
    ).join('');
    trigSec.style.display = '';
  } else {
    trigSec.style.display = 'none';
  }

  // Actions
  const actSec = document.getElementById('modal-actions-section');
  const actWrap = document.getElementById('modal-actions');
  if (c.actions.length > 0) {
    actWrap.innerHTML = c.actions.map(a =>
      `<span class="modal-tag modal-tag-action">${escapeHtml(a)}</span>`
    ).join('');
    actSec.style.display = '';
  } else {
    actSec.style.display = 'none';
  }

  // Related (같은 카테고리, 자신 제외, 최대 4개)
  const related = CONNECTORS.filter(x => x.category === c.category && x.id !== c.id).slice(0, 4);
  const relSec = document.getElementById('modal-related-section');
  const relWrap = document.getElementById('modal-related');
  if (related.length > 0) {
    relWrap.innerHTML = related.map(r => `
      <div class="related-card" data-id="${r.id}">
        <div class="related-card-ko">${escapeHtml(r.nameKo)}</div>
        <div class="related-card-en">${escapeHtml(r.nameEn)}</div>
      </div>
    `).join('');
    relWrap.querySelectorAll('.related-card').forEach(el => {
      el.addEventListener('click', () => openModal(parseInt(el.dataset.id)));
    });
    relSec.style.display = '';
  } else {
    relSec.style.display = 'none';
  }

  // Open
  document.getElementById('modal-backdrop').classList.add('active');
  document.body.style.overflow = 'hidden';

  // --- 상세 정보 및 AI 추천 로직 추가 ---
  const details = (typeof CONNECTOR_DETAILS !== 'undefined') ? CONNECTOR_DETAILS[id] : null;
  
  // 연결 방법
  const howSec = document.getElementById('modal-how-to-section');
  const howList = document.getElementById('modal-how-to');
  if (details && details.howToConnect && details.howToConnect.length > 0) {
    howList.innerHTML = details.howToConnect.map(step => `<li>${escapeHtml(step)}</li>`).join('');
    howSec.style.display = 'block';
  } else {
    howSec.style.display = 'none';
  }

  // 필수 조건
  const preSec = document.getElementById('modal-prereqs-section');
  const preWrap = document.getElementById('modal-prereqs');
  if (details && details.prerequisites && details.prerequisites.length > 0) {
    preWrap.innerHTML = details.prerequisites.map(p => `<span class="prereq-tag">${escapeHtml(p)}</span>`).join('');
    preSec.style.display = 'block';
  } else {
    preSec.style.display = 'none';
  }

  // AI 프롬프트 추천 (커넥터 이름 + 설명 + 트리거/액션 키워드로 검색)
  const searchQuery = `${c.nameKo} ${c.nameEn} ${c.description} ${c.triggers.join(' ')} ${c.actions.join(' ')}`;
  const recommendedPrompts = promptFuse.search(searchQuery).slice(0, 4);
  const aiWrap = document.getElementById('modal-ai-prompts');
  
  if (recommendedPrompts.length > 0) {
    aiWrap.innerHTML = recommendedPrompts.map(r => `
      <div class="recommendation-card" onclick="location.href='prompts.html?id=${r.item.id}'">
        <div class="rec-type">${escapeHtml(r.item.category)}</div>
        <div class="rec-title">${escapeHtml(r.item.title)}</div>
        <div class="rec-meta">#${r.item.id}</div>
      </div>
    `).join('');
    document.getElementById('modal-ai-section').style.display = 'block';
  } else {
    document.getElementById('modal-ai-section').style.display = 'none';
  }
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('active');
  document.body.style.overflow = '';
  state.openConnector = null;
}

// ============================================================
//  UI EVENT HANDLERS
// ============================================================

// Search input
const searchInput = document.getElementById('main-search');
const clearBtn   = document.getElementById('search-clear');

let searchTimer = null;
searchInput.addEventListener('input', e => {
  state.query = e.target.value;
  clearBtn.style.display = state.query ? 'block' : 'none';
  // 시나리오 버튼 비활성화
  if (state.query) {
    deactivateScenarios();
    state.scenario = null;
  }
  clearTimeout(searchTimer);
  searchTimer = setTimeout(search, 180); // debounce
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  state.query = '';
  clearBtn.style.display = 'none';
  search();
});

// Scenario buttons
function deactivateScenarios() {
  document.querySelectorAll('.scenario-btn').forEach(b => b.classList.remove('active'));
}

document.querySelectorAll('.scenario-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.classList.contains('active')) {
      // 토글 비활성화
      btn.classList.remove('active');
      state.scenario = null;
    } else {
      deactivateScenarios();
      btn.classList.add('active');
      state.scenario = btn.dataset.keywords;
      // 검색창 초기화
      searchInput.value = '';
      state.query = '';
      clearBtn.style.display = 'none';
    }
    search();
  });
});

// Tier buttons
document.querySelectorAll('.tier-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tier-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.tier = btn.dataset.tier;
    search();
  });
});

// Sort
document.getElementById('sort-select').addEventListener('change', e => {
  state.sort = e.target.value;
  search();
});

// View toggle
document.getElementById('view-grid').addEventListener('click', () => {
  state.viewMode = 'grid';
  document.getElementById('cards-container').classList.remove('list-view');
  document.getElementById('view-grid').classList.add('active');
  document.getElementById('view-list').classList.remove('active');
});

document.getElementById('view-list').addEventListener('click', () => {
  state.viewMode = 'list';
  document.getElementById('cards-container').classList.add('list-view');
  document.getElementById('view-list').classList.add('active');
  document.getElementById('view-grid').classList.remove('active');
});

// Modal close
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-backdrop').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-backdrop')) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// Reset all
function resetAll() {
  searchInput.value = '';
  state.query = '';
  state.scenario = null;
  state.tier = 'all';
  state.categories.clear();
  state.sort = 'relevance';
  clearBtn.style.display = 'none';

  deactivateScenarios();
  document.querySelectorAll('.tier-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tier-all').classList.add('active');
  document.querySelectorAll('.cat-cb').forEach(cb => { cb.checked = false; });
  document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('selected'));
  document.getElementById('sort-select').value = 'relevance';

  search();
}

document.getElementById('reset-all').addEventListener('click', resetAll);
document.getElementById('logo-home').addEventListener('click', e => { e.preventDefault(); resetAll(); });

// ============================================================
//  INIT
// ============================================================
document.getElementById('stat-total').textContent = CONNECTORS.length.toLocaleString();
initCategories();
// URL 파라미터 체크 (id가 있으면 모달 열기)
const urlParams = new URLSearchParams(window.location.search);
const directId = urlParams.get('id');
if (directId) {
  setTimeout(() => openModal(parseInt(directId)), 500);
}
</script>
</body>
</html>
